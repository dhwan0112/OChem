<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560">
<style>
.ink{stroke:#1b1b1f;fill:#1b1b1f}.inks{stroke:#1b1b1f;fill:none}
.nu{stroke:#1d4ed8;fill:#1d4ed8}.nus{stroke:#1d4ed8;fill:none}
.el{stroke:#b91c1c;fill:#b91c1c}.els{stroke:#b91c1c;fill:none}
.arr{stroke:#c2410c;fill:none}.arrh{fill:#c2410c;stroke:none}
.good{stroke:#15803d;fill:#15803d}.goods{stroke:#15803d;fill:none}
.muted{fill:#6b7280;stroke:#6b7280}.mutedt{fill:#6b7280;stroke:none}
.bg{fill:#ffffff}.monoonly{display:none}
text{stroke:none}
@media (prefers-color-scheme: dark){
.ink{stroke:#e6e6ea;fill:#e6e6ea}.inks{stroke:#e6e6ea}
.nu{stroke:#8ab4ff;fill:#8ab4ff}.nus{stroke:#8ab4ff}
.el{stroke:#ff8a8a;fill:#ff8a8a}.els{stroke:#ff8a8a}
.arr{stroke:#ff9f5a}.arrh{fill:#ff9f5a}
.good{stroke:#4ade80;fill:#4ade80}.goods{stroke:#4ade80}
.muted{fill:#a1a1aa;stroke:#a1a1aa}.mutedt{fill:#a1a1aa}
.bg{fill:#1e1e1e}}
text.ink,text.nu,text.el,text.good,text.muted,text.mutedt,text.inks{stroke:none}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrh" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="rh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="1120" height="560" rx="14"/>
<text class="ink" x="24.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Why ketene can do π2s + π2a but a plain alkene cannot</text><text class="mutedt" x="24.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Top view: alkene 1 (HOMO, blue) lies flat; its p orbitals point at you (+ lobes on top). Partner (LUMO, red) sits above it, crossed at 90°.</text><text class="ink" x="200.0" y="96.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">(b) alkene + alkene, crossed</text><text class="mutedt" x="200.0" y="116.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">2 bonding vs 2 antibonding → no net gain</text><line class="nus" x1="138.0" y1="300.0" x2="262.0" y2="300.0" stroke-width="3" stroke-linecap="round"/><circle class="nu" cx="138" cy="300" r="24" fill-opacity="0.8" stroke-width="1.6"/><text class="bg" x="138.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">+</text><circle class="nu" cx="262" cy="300" r="24" fill-opacity="0.8" stroke-width="1.6"/><text class="bg" x="262.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">+</text><line class="els" x1="200.0" y1="238.0" x2="200.0" y2="362.0" stroke-width="3" stroke-linecap="round"/><ellipse class="el" cx="230" cy="238" rx="27" ry="11" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="els" cx="170" cy="238" rx="27" ry="11" stroke-width="1.5"/><ellipse class="els" cx="230" cy="362" rx="27" ry="11" stroke-width="1.5"/><ellipse class="el" cx="170" cy="362" rx="27" ry="11" fill-opacity="0.85" stroke-width="1.5"/><circle class="ink" cx="200" cy="238" r="3.5"/><circle class="ink" cx="200" cy="362" r="3.5"/><line class="goods" x1="252.0" y1="246.0" x2="256.0" y2="278.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,4"/><line class="els" x1="148.0" y1="246.0" x2="144.0" y2="278.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2,5"/><text class="el" x="136.0" y="252.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">×</text><line class="els" x1="252.0" y1="354.0" x2="256.0" y2="322.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2,5"/><text class="el" x="264.0" y="348.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">×</text><line class="goods" x1="148.0" y1="354.0" x2="144.0" y2="322.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,4"/><text class="el" x="200.0" y="208.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">C</text><text class="el" x="200.0" y="394.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">C</text><text class="ink" x="560.0" y="96.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">(c) ketene + alkene, crossed</text><text class="mutedt" x="560.0" y="116.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">extra p orbital on the central C: 4 bonding vs 2 antibonding</text><line class="nus" x1="498.0" y1="300.0" x2="622.0" y2="300.0" stroke-width="3" stroke-linecap="round"/><circle class="nu" cx="498" cy="300" r="24" fill-opacity="0.8" stroke-width="1.6"/><text class="bg" x="498.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">+</text><circle class="nu" cx="622" cy="300" r="24" fill-opacity="0.8" stroke-width="1.6"/><text class="bg" x="622.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">+</text><line class="els" x1="560.0" y1="238.0" x2="560.0" y2="362.0" stroke-width="3" stroke-linecap="round"/><ellipse class="el" cx="590" cy="238" rx="27" ry="11" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="els" cx="530" cy="238" rx="27" ry="11" stroke-width="1.5"/><ellipse class="els" cx="590" cy="362" rx="27" ry="11" stroke-width="1.5"/><ellipse class="el" cx="530" cy="362" rx="27" ry="11" fill-opacity="0.85" stroke-width="1.5"/><circle class="ink" cx="560" cy="238" r="3.5"/><circle class="ink" cx="560" cy="362" r="3.5"/><line class="goods" x1="612.0" y1="246.0" x2="616.0" y2="278.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,4"/><line class="els" x1="508.0" y1="246.0" x2="504.0" y2="278.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2,5"/><text class="el" x="496.0" y="252.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">×</text><line class="els" x1="612.0" y1="354.0" x2="616.0" y2="322.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2,5"/><text class="el" x="624.0" y="348.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">×</text><line class="goods" x1="508.0" y1="354.0" x2="504.0" y2="322.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,4"/><text class="el" x="560.0" y="208.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">C(central)</text><text class="el" x="560.0" y="394.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">CR₂</text><circle class="good" cx="560" cy="238" r="17" fill-opacity="0.35" stroke-width="2"/><text class="mutedt" x="560.0" y="186.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">=O  (C=O π* points down at alkene 1)</text><line class="goods" x1="546.0" y1="248.0" x2="516.0" y2="286.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,4"/><line class="goods" x1="574.0" y1="248.0" x2="604.0" y2="286.0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,4"/><text class="el" x="790.0" y="150.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Why (b) fails</text><text class="ink" x="790.0" y="172.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• crossed approach: bonding at 2 corners,</text><text class="ink" x="790.0" y="194.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">  antibonding at the other 2</text><text class="ink" x="790.0" y="216.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• poor overlap, substituents clash</text><text class="ink" x="790.0" y="238.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• supra/supra is S+A → forbidden</text><text class="good" x="790.0" y="282.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Why (c) works</text><text class="ink" x="790.0" y="304.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• central C is sp: a second π (C=O)</text><text class="ink" x="790.0" y="326.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">  at 90° to the C=C</text><text class="ink" x="790.0" y="348.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• that p orbital bonds to BOTH alkene</text><text class="ink" x="790.0" y="370.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">  carbons → net bonding</text><text class="ink" x="790.0" y="392.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• low-lying LUMO (electrophilic C=O)</text><text class="ink" x="790.0" y="414.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">• central C carries no substituents</text><text class="ink" x="790.0" y="436.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">  → crossed approach is not blocked</text><g class="coloronly"><text class="mutedt" x="24.0" y="505.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Green dashed: in-phase (bonding) overlap; red dotted ×: out-of-phase (antibonding). Green circle: ketene C=O π* lobe facing alkene 1.</text></g><g class="monoonly"><text class="mutedt" x="24.0" y="505.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Dashed: in-phase (bonding) overlap; dotted ×: out-of-phase (antibonding). Shaded circle: ketene C=O π* lobe facing alkene 1.</text></g><text class="mutedt" x="24.0" y="530.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Sources: CM3121 L15 p.6–8 (cumulated double bonds; thermal [2+2]); Clayden 2e p.898–899 (crossed approach, extra p orbital).</text>
</svg>