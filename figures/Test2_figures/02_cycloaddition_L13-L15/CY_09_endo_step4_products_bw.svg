nant-baseline="central" font-weight="bold" font-style="normal">Three-step recipe for any DA stereo question (L14 p.16–19)</text><text class="ink" x="36.0" y="484.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">1. Regio: ortho/para rule decides which atoms bond (skip for symmetric partners).</text><text class="ink" x="36.0" y="508.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">2. Endo: put the EWG under the diene → in the product it sits on the same face as the diene’s OUT groups (or anti to the bridge).</text><text class="ink" x="36.0" y="532.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">3. Stereospecificity: substituents keep their cis/trans relationship from the dienophile (and in/out from the diene).</text><text class="mutedt" x="24.0" y="576.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Sources: L13 p.21–24; L14 p.16–19. Structures schematic (bicyclic drawn from the same 3D model as endo_rule_3D.gif).</text>
