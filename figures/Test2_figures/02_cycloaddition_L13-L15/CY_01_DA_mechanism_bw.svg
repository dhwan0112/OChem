<rect class="bg" width="1080" height="440" rx="14"/>
<text class="ink" x="24.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Diels–Alder: a [4+2] cycloaddition</text><text class="mutedt" x="24.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">diene (4π, HOMO) + dienophile (2π, LUMO) → cyclohexene; one concerted step through a cyclic 6-electron TS</text><line class="nus" x1="151.5" y1="173.6" x2="113.4" y2="195.6" stroke-width="1.9" stroke-linecap="round"/><line class="nus" x1="148.5" y1="168.4" x2="110.4" y2="190.4" stroke-width="1.9" stroke-linecap="round"/><line class="nus" x1="111.9" y1="193.0" x2="111.9" y2="237.0" stroke-width="1.9" stroke-linecap="round"/><line class="nus" x1="113.4" y1="234.4" x2="151.5" y2="256.4" stroke-width="1.9" stroke-linecap="round"/><line class="nus" x1="110.4" y1="239.6" x2="148.5" y2="261.6" stroke-width="1.9" stroke-linecap="round"/><line class="els" x1="217.1" y1="193.0" x2="217.1" y2="237.0" stroke-width="1.9" stroke-linecap="round"/><line class="els" x1="211.1" y1="193.0" x2="211.1" y2="237.0" stroke-width="1.9" stroke-linecap="round"/><text class="mutedt" x="138.0" y="167.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">1</text><text class="mutedt" x="97.9" y="193.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">2</text><text class="mutedt" x="97.9" y="237.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">3</text><text class="mutedt" x="138.0" y="263.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">4</text><text class="mutedt" x="227.1" y="189.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">6</text><text class="mutedt" x="227.1" y="241.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">5</text><path class="arr" d="M123.9,178.0 Q93.1,184.9 102.9,215.0" stroke-width="1.8" marker-end="url(#ah)"/><path class="arr" d="M126.9,255.0 Q170.6,286.1 206.1,246.0" stroke-width="1.8" marker-end="url(#ah)"/><path class="arr" d="M223.1,215.0 Q220.2,153.2 159.0,162.0" stroke-width="1.8" marker-end="url(#ah)"/><text class="nu" x="150.0" y="307.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">s-cis diene</text><text class="el" x="224.1" y="307.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">dienophile</text><line class="inks" x1="260" y1="215" x2="330" y2="215" stroke-width="2" marker-end="url(#rh)"/><line class="nus" x1="430.0" y1="171.0" x2="391.9" y2="193.0" stroke-width="1.9" stroke-linecap="round"/><line class="nus" x1="391.9" y1="193.0" x2="391.9" y2="237.0" stroke-width="1.9" stroke-linecap="round"/><line class="nus" x1="391.9" y1="237.0" x2="430.0" y2="259.0" stroke-width="1.9" stroke-linecap="round"/><line class="els" x1="468.1" y1="193.0" x2="468.1" y2="237.0" stroke-width="1.9" stroke-linecap="round"/><line class="goods" x1="430.0" y1="171.0" x2="468.1" y2="193.0" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,5"/><line class="goods" x1="430.0" y1="259.0" x2="468.1" y2="237.0" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="5,5"/><circle class="inks" cx="430" cy="215" r="24.2" stroke-width="1.5" stroke-dasharray="4,4"/><text class="ink" x="496.0" y="157.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">‡</text><text class="mutedt" x="430.0" y="307.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">cyclic TS, 6 e⁻</text><text class="mutedt" x="430.0" y="325.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">(“aromatic” 4n+2)</text><line class="inks" x1="530" y1="215" x2="600" y2="215" stroke-width="2" marker-end="url(#rh)"/><line class="inks" x1="700.0" y1="171.0" x2="661.9" y2="193.0" stroke-width="1.9" stroke-linecap="round"/><line class="goods" x1="661.9" y1="193.0" x2="661.9" y2="237.0" stroke-width="1.9" stroke-linecap="round"/><line class="goods" x1="667.9" y1="199.0" x2="667.9" y2="231.0" stroke-width="1.9" stroke-linecap="round"/><line class="inks" x1="661.9" y1="237.0" x2="700.0" y2="259.0" stroke-width="1.9" stroke-linecap="round"/><line class="inks" x1="738.1" y1="237.0" x2="738.1" y2="193.0" stroke-width="1.9" stroke-linecap="round"/><line class="goods" x1="700.0" y1="171.0" x2="738.1" y2="193.0" stroke-width="3" stroke-linecap="round"/><line class="goods" x1="700.0" y1="259.0" x2="738.1" y2="237.0" stroke-width="3" stroke-linecap="round"/><text class="ink" x="700.0" y="307.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">cyclohexene</text><text class="good" x="795.0" y="150.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">•</text><text class="good" x="807.0" y="150.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">2 new σ bonds (C1–C6, C4–C5)</text><text class="good" x="795.0" y="176.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">•</text><text class="good" x="807.0" y="176.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">new π bond (C2=C3)</text><text class="ink" x="795.0" y="202.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">•</text><text class="ink" x="807.0" y="202.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">3 π bonds → 1 π + 2 σ</text><text class="ink" x="795.0" y="228.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">•</text><text class="ink" x="807.0" y="228.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">[π4s + π2s]: thermally allowed</text><text class="ink" x="795.0" y="254.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">•</text><text class="ink" x="807.0" y="254.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">no intermediate → stereospecific</text><text class="mutedt" x="24.0" y="400.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Sources: CM3121 L13 p.10 (mechanism), p.19 (stereospecificity), p.33–35 (Woodward–Hoffmann).</text><g class="coloronly"><text class="mutedt" x="24.0" y="418.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Orange: electron flow; blue: diene; red: dienophile; green: bonds formed.</text></g><g class="monoonly"><text class="mutedt" x="24.0" y="418.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Curved arrows: electron flow; bold bonds: new σ bonds; dashed: partial bonds in the TS.</text></g>
</svg>