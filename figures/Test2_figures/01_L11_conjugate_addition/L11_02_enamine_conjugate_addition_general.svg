<rect width="900" height="790" fill="white"/>
<text x="30" y="36" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111">Conjugate addition of enamines — general scheme</text>
<text x="30" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">The enamine α-carbon (neutral, soft C-nucleophile) attacks the β-carbon of an α,β-unsaturated carbonyl; water then restores both C=O groups.</text>
<line x1="30" y1="715" x2="58" y2="715" stroke="#1e8449" stroke-width="2.4"/><text x="66" y="715" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">new C–C bond</text><path d="M180,721 Q194,705 208,715" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#ah)"/><text x="218" y="715" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444">electron-pair movement</text><text x="400" y="715" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e6fb7">1–5: carbonyl C to carbonyl C</text><text x="30" y="743" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444">Z = H, R, OR (aldehyde, ketone, ester acceptor); R¹ and R² may be joined in a ring (e.g. cyclohexanone enamine); typical 2° amines: pyrrolidine, morpholine.</text><text x="30" y="765" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666">Sources: CM3121 L11 p.14, 18–19; curved-arrow mechanism: Clayden 2e p.608 (supplement).</text>
<text x="30.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">1. enamine formation (L11 p.18)</text><line x1="79.5" y1="159.5" x2="104.6" y2="145.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="101.8" y1="145.0" x2="101.8" y2="116.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="107.4" y1="145.0" x2="107.4" y2="116.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="104.6" y1="145.0" x2="139.3" y2="165.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="139.3" y1="165.0" x2="164.4" y2="150.5" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><text x="75.5" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="end" dominant-baseline="central" font-weight="normal" font-style="normal">R¹</text><text x="104.6" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">O</text><text x="168.4" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">R²</text><text x="139.3" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="italic">α</text><text x="221.9" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">+</text><text x="251.2" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">R<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">NH</tspan></text><text x="268.9" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#444" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">(2° amine)</text><line x1="370" y1="157" x2="520" y2="157" stroke="#111" stroke-width="1.8" marker-end="url(#rh)"/><text x="417.4" y="143.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">H<tspan dy="-5" font-size="10">+</tspan><tspan dy="5"> (cat.)</tspan></text><text x="431.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">−H<tspan dy="3" font-size="10">2</tspan><tspan dy="-3">O</tspan></text><text x="324.9" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">via iminium, then loss of H<tspan dy="-5" font-size="10">+</tspan><tspan dy="5"> from the α-C</tspan></text><line x1="584.5" y1="159.5" x2="609.6" y2="145.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="609.6" y1="145.0" x2="609.6" y2="116.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="611.0" y1="142.6" x2="645.7" y2="162.6" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="608.2" y1="147.4" x2="642.9" y2="167.4" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="644.3" y1="165.0" x2="669.4" y2="150.5" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><text x="580.5" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="end" dominant-baseline="central" font-weight="normal" font-style="normal">R¹</text><text x="604.1" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">NR<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> </tspan></text><text x="673.4" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">R²</text><text x="644.3" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="italic">α</text><text x="738.9" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">enamine</text><text x="30.0" y="275.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#444" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">2. conjugate (1,4) addition (L11 p.19)</text><line x1="79.5" y1="364.5" x2="104.6" y2="350.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="104.6" y1="350.0" x2="104.6" y2="321.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="106.0" y1="347.6" x2="140.7" y2="367.6" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="103.2" y1="352.4" x2="137.9" y2="372.4" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><line x1="139.3" y1="370.0" x2="139.3" y2="399.0" stroke="#111" stroke-width="1.8" stroke-linecap="round"/><text x="75.5" y="370.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="end" dominant-baseline="central" font-weight="normal" font-style="normal">R¹</text><text x="99.1" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">NR<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> </tspan></text><text x="139.3" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111" text-anchor="middle" domin