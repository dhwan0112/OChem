<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500">
<style>
.ink,.nu,.el,.good{stroke:#000;fill:#000}.inks,.nus,.els,.goods,.arr{stroke:#000;fill:none}
.arrh{fill:#000;stroke:none}.muted{fill:#444;stroke:#444}.mutedt{fill:#444;stroke:none}.bg{fill:#fff}.coloronly{display:none}
text{stroke:none}
text.ink,text.nu,text.el,text.good,text.muted,text.mutedt,text.inks{stroke:none}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrh" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="rh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="1080" height="500" rx="14"/>
<text class="ink" x="24.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Woodward–Hoffmann counting: which components count?</text><text class="mutedt" x="24.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Thermal pericyclic reaction is allowed when (number of (4q+2)s components) + (number of (4r)a components) is ODD.</text><text class="ink" x="30.0" y="100.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">1. Split the reaction into components</text><text class="mutedt" x="30.0" y="124.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">   (π bonds, σ bonds, lone pair / empty p = ω)</text><text class="ink" x="30.0" y="148.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">2. Count electrons in each component</text><text class="mutedt" x="30.0" y="172.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">   2, 6, 10 → (4q+2)    0, 4, 8 → (4r)</text><text class="ink" x="30.0" y="196.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">3. Decide s or a for each component</text><text class="mutedt" x="30.0" y="220.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">   (same face at both ends = s; opposite = a)</text><text class="ink" x="30.0" y="244.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">4. Count only the shaded cells, then add</text><rect class="good" x="520" y="135" width="230" height="92" fill-opacity="0.16" stroke-width="2"/><text class="good" x="635.0" y="169.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">COUNT (+1 each)</text><text class="good" x="635.0" y="195.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">(4q+2)s</text><rect class="inks" x="750" y="135" width="230" height="92" stroke-width="1.2" stroke-dasharray="4,4"/><text class="mutedt" x="865.0" y="169.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">ignore (0)</text><text class="mutedt" x="865.0" y="195.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">(4q+2)a</text><rect class="inks" x="520" y="227" width="230" height="92" stroke-width="1.2" stroke-dasharray="4,4"/><text class="mutedt" x="635.0" y="261.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">ignore (0)</text><text class="mutedt" x="635.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">(4r)s</text><rect class="good" x="750" y="227" width="230" height="92" fill-opacity="0.16" stroke-width="2"/><text class="good" x="865.0" y="261.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">COUNT (+1 each)</text><text class="good" x="865.0" y="287.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">(4r)a</text><text class="ink" x="635.0" y="97.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">s (suprafacial)</text><text class="ink" x="865.0" y="97.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">a (antarafacial)</text><text class="mutedt" x="635.0" y="117.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">bonds on the same face</text><text class="mutedt" x="865.0" y="117.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">bonds on opposite faces</text><text class="ink" x="450.0" y="171.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">(4q+2)</text><text class="mutedt" x="450.0" y="193.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">2, 6, 10 e⁻</text><text class="ink" x="450.0" y="263.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">(4r)</text><text class="mutedt" x="450.0" y="285.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">0, 4, 8 e⁻</text><text class="good" x="750.0" y="352.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">sum ODD → thermally allowed</text><text class="el" x="750.0" y="373.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">sum EVEN → thermally forbidden</text><text class="mutedt" x="750.0" y="396.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">photochemical (hν): the opposite parity (even → allowed)</text><text class="ink" x="30.0" y="300.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">q and r are just whole numbers (0, 1, 2 …).</text><text class="mutedt" x="30.0" y="322.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">You never need their values — only whether a component</text><text class="mutedt" x="30.0" y="342.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">holds 2/6/10 electrons (4q+2) or 0/4/8 electrons (4r).</text><text class="ink" x="30.0" y="374.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Electron count per component, not atom count:</text><text class="mutedt" x="30.0" y="396.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">allyl cation = 3 atoms, 2 e⁻ → (4q+2);  diene = 4 e⁻ → (4r)</text><text class="mutedt" x="30.0" y="418.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">σ C–H bond = 2 e⁻ → (4q+2);  empty p orbital (ω0) = 0 e⁻ → (4r)</text><text class="mutedt" x="24.0" y="478.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Sources: CM3121 L13 p.33–34; L14 p.4–6; L16 p.25 (photochemical reactions follow the opposite rules).</text>
</svg>