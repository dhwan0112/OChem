<rect class="bg" width="1080" height="505" rx="14"/>
<text class="ink" x="24.0" y="30.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">Step 1. Phase, not direction: why lobes must match</text><text class="mutedt" x="24.0" y="56.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal">Filled lobe = + phase, open lobe = − phase. A new bond forms only where two lobes of the SAME phase overlap.</text><ellipse class="nu" cx="90.0" cy="182.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="nus" cx="90.0" cy="237.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="90.0" cy="210.0" r="2.6"/><text class="ink" x="120.0" y="172.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">+</text><text class="ink" x="120.0" y="248.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal">−</text><text class="ink" x="90.0" y="305.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">one p orbital:</text><text class="mutedt" x="90.0" y="324.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">top and bottom lobes</text><text class="mutedt" x="90.0" y="341.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">have opposite signs</text><text class="good" x="330.0" y="100.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">same phase → bonding</text><ellipse class="nu" cx="300.0" cy="182.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="nus" cx="300.0" cy="237.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="300.0" cy="210.0" r="2.6"/><ellipse class="el" cx="360.0" cy="182.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="els" cx="360.0" cy="237.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="360.0" cy="210.0" r="2.6"/><path class="goods" d="M308,160 Q330,138 352,160" stroke-width="2.4" stroke-dasharray="5,4"/><text class="ink" x="330.0" y="305.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">top meets top:</text><text class="mutedt" x="330.0" y="324.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">+ with + → bond</text><text class="el" x="540.0" y="100.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">opposite phase → node</text><ellipse class="nu" cx="510.0" cy="182.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="nus" cx="510.0" cy="237.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="510.0" cy="210.0" r="2.6"/><ellipse class="els" cx="570.0" cy="182.5" rx="10.6" ry="27.5" stroke-width="1.5"/><ellipse class="el" cx="570.0" cy="237.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><circle class="ink" cx="570.0" cy="210.0" r="2.6"/><path class="els" d="M518,160 Q540,138 562,160" stroke-width="2.4" stroke-dasharray="2,5"/><text class="el" x="540.0" y="130.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">×</text><text class="ink" x="540.0" y="305.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">top meets top:</text><text class="mutedt" x="540.0" y="324.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="normal">+ with − → no bond</text><text class="ink" x="875.0" y="100.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal">the same π* used two ways</text><ellipse class="nu" cx="745.0" cy="157.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="nus" cx="745.0" cy="212.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="745.0" cy="185.0" r="2.6"/><ellipse class="nu" cx="805.0" cy="157.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="nus" cx="805.0" cy="212.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="805.0" cy="185.0" r="2.6"/><line class="inks" x1="745.0" y1="185.0" x2="805.0" y2="185.0" stroke-width="1.3" stroke-linecap="round"/><ellipse class="els" cx="745.0" cy="277.5" rx="10.6" ry="27.5" stroke-width="1.5"/><ellipse class="el" cx="745.0" cy="332.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><circle class="ink" cx="745.0" cy="305.0" r="2.6"/><ellipse class="el" cx="805.0" cy="277.5" rx="10.6" ry="27.5" fill-opacity="0.85" stroke-width="1.5"/><ellipse class="els" cx="805.0" cy="332.5" rx="10.6" ry="27.5" stroke-width="1.5"/><circle class="ink" cx="805.0" cy="305.0" r="2.6"/><line class="inks" x1="745.0" y1="305.0" x2="805.0" y2="305.0" stroke-width="1.3" stroke-linecap="round"/><line class="goods" x1="745.0" y1="222.0" x2="745.0" y2="26